<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>متجر فالكيري</title>
  <script src="https://kit.fontawesome.com/24b6a00007.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      position: relative;
      min-height: 100%;
      background-color: #fbf5f7;
    }
    
    body {
      margin: 0;
      font-family: "Alexandria", sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    header {
      background: linear-gradient(135deg, #f3a9c8, #f8d7e3);
      padding: 1.5rem;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px rgba(209, 159, 178, 0.3);
    }
    
    header h1 {
      margin: 0;
      font-weight: 700;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
    }
    
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: url('main.jpg') no-repeat center center;
      background-size: cover;
      position: relative;
      padding: 2rem 0;
    }
    
    main::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    
    #dataSection {
      width: 100%;
      margin-bottom: 2rem;
    }
    
    .offers-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #333;
      margin: 1rem 0;
      padding: 1rem;
      background-color: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(5px);
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(209, 159, 178, 0.2);
    }
    
    .offer-card {
      display: flex;
      flex-direction: column;
      background-color: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(5px);
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(209, 159, 178, 0.2);
      margin: 1rem 0;
      overflow: hidden;
    }
    
    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    
    .card-content h3 {
      color: #333;
      font-weight: 700;
    }
    
    .card-content p {
      color: #555;
      font-size: 0.95rem;
    }
    
    .card-content .price {
      font-weight: 600;
      color: #e68fac;
    }
    
    .purchase-btn {
      border: none;
      border-radius: 30px;
      background: linear-gradient(to right, #e68fac, #f8c4d9);
      color: white;
      padding: 0.8rem 2rem;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: "Alexandria", sans-serif;
      align-self: flex-start;
      margin-top: 0.5rem;
    }
    
    .purchase-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(230, 143, 172, 0.4);
    }
    
    footer {
      background-color: rgba(248, 215, 227, 0.8);
      color: #333;
      text-align: center;
      padding: 1.5rem;
      margin-top: auto;
      backdrop-filter: blur(5px);
    }
    
    footer p {
      margin: 0;
    }
    
    footer a {
      color: #e68fac;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    footer a:hover {
      color: #d16b8f;
      text-decoration: underline;
    }
    
    /* Cherry blossom petals animation */
    .petal {
      position: absolute;
      background-color: #fff;
      border-radius: 150% 0 150% 0;
      animation: falling linear infinite;
      z-index: 0;
      opacity: 0.8;
    }
    
    @keyframes falling {
      0% {
        top: -10%;
        transform: rotate(0deg) translateX(0);
      }
      100% {
        top: 100%;
        transform: rotate(360deg) translateX(20px);
      }
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      header {
        padding: 1rem;
      }
      
      .card-content {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>متجر فالكيري</h1>
    <h1>🌸🍓</h1>
    <h1>𝚅𝚊𝚕𝚔𝚢𝚛𝚒𝚎</h1>
  </header>
  
  <main>
    <section id="dataSection" class="content">
      <!-- Shop offers will be loaded here by JavaScript -->
    </section>
  </main>
  
  <footer>
    <p>كل الحقوق محفوظة <a href="https://www.instagram.com/arthur_sensai?igsh=MWdwbjI5YTluZTJyeQ==">Arthur</a></p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
    import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDtN-6_8_adIwoOsdlymqz3OQlLTIO51BA",
        authDomain: "valkiri-app.firebaseapp.com",
        databaseURL: "https://valkiri-app-default-rtdb.firebaseio.com",
        projectId: "valkiri-app",
        storageBucket: "valkiri-app.appspot.com",
        messagingSenderId: "28209650847",
        appId: "1:28209650847:web:65f73e68bedf8b43f516aa"
    };
      
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // Create cherry blossom petals
    function createPetals() {
      const petalCount = 15;
      for (let i = 0; i < petalCount; i++) {
        const petal = document.createElement('div');
        petal.classList.add('petal');
        
        const size = Math.random() * 10 + 5;
        const left = Math.random() * 100;
        const delay = Math.random() * 10;
        const duration = Math.random() * 10 + 10;
        
        petal.style.width = `${size}px`;
        petal.style.height = `${size}px`;
        petal.style.left = `${left}%`;
        petal.style.animationDelay = `${delay}s`;
        petal.style.animationDuration = `${duration}s`;
        petal.style.backgroundColor = `rgba(255, ${Math.random() * 30 + 225}, ${Math.random() * 30 + 225}, ${Math.random() * 0.3 + 0.7})`;
        
        document.body.appendChild(petal);
      }
    }
    createPetals();

    function fetchData() {
      const offersPath = ref(db, 'shop');
      get(offersPath).then((snapshot) => {
        const dataSection = document.getElementById("dataSection");
        if (snapshot.exists()) {
          const offers = snapshot.val();
          let offersHTML = '<h2 class="offers-title">العروض المتوفرة</h2>';
          
          Object.keys(offers).forEach((offerId, index) => {
            const offer = offers[offerId];
            offersHTML += `
              <div class="offer-card">
                <div class="card-content">
                  <h3>${offer.title}</h3>
                  <p>${offer.description}</p>
                  <p class="price">السعر: ${offer.price}</p>
                  <button class="purchase-btn" id="purchase-button-${index}" data-title="${offer.title}">طلب العرض</button>
                </div>
              </div>
            `;
          });
          
          dataSection.innerHTML = offersHTML;
          attachPurchaseButtonEvents();
        } else {
          dataSection.innerHTML = '<h2 class="offers-title">لا تتوفر اي عروض حاليا</h2>';
        }
      }).catch((error) => {
        console.error("Error fetching offers: ", error);
      });
    }

    function attachPurchaseButtonEvents() {
      const purchaseButtons = document.querySelectorAll('[id^="purchase-button-"]');
      purchaseButtons.forEach(function(button) {
        button.addEventListener('click', function() {
          const offerTitle = button.dataset.title;
          const phoneNumber = '+355684556920';
          const message = `مرحبا، أود طلب عرض: ${offerTitle}`;
          window.open(generateWhatsAppLink(phoneNumber, message), '_blank');
        });
      });
    }

    function generateWhatsAppLink(phoneNumber, message) {
      let encodedMessage = encodeURIComponent(message);
      let whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
      return whatsappUrl;
    }

    window.onload = () => {
      fetchData();
    };
  </script>
</body>
</html>
